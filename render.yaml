services:
  - type: web
    name: abhyas
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: ALEMBIC_DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PHONE_HASH_SALT
        sync: false
      - key: PHONE_ENC_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL_FAST
        value: claude-haiku-5-5
      - key: CLAUDE_MODEL_SMART
        value: claude-sonnet-5-5
      - key: CLAUDE_MODEL_BUILD
        value: claude-sonnet-5-5
      - key: STT_PROVIDER
        value: sarvam
      - key: TTS_PROVIDER
        value: sarvam
      - key: SARVAM_API_KEY
        sync: false
      - key: WHATSAPP_ENABLED
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
