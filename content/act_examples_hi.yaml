  addressed_child: priya
  context_hi: "जोड़ या घटाव का प्रश्न"
  explanation_hi: "शिक्षिका बच्ची से उसका तर्क स्पष्ट करने को कहती है।"

- act: concrete_representation
  teacher_line_hi: "रवि, ये देखो—5 बंडल और 2 खुली तीलियाँ यानी 52। चलो एक बंडल खोलकर तीलियाँ गिनते हैं।"
  quote: "5 बंडल और 2 खुली तीलियाँ यानी 52। चलो एक बंडल खोलकर तीलियाँ गिनते हैं"
  addressed_child: ravi
  context_hi: "हासिल वाला घटाव - रवि worked example टर्न 2"
  explanation_hi: "शिक्षिका तीलियों और बंडल (मूर्त सामग्री) का उपयोग करके अवधारणा समझाती है।"

- act: concrete_representation
  teacher_line_hi: "बच्चों, 10-10 कंकड़ों की ढेरी बनाकर गिनो कि कुल कितने हुए।"
  quote: "10-10 कंकड़ों की ढेरी बनाकर गिनो"
  addressed_child: all
  context_hi: "गिनती और बंडल बनाना"
  explanation_hi: "मूर्त वस्तुओं (कंकड़) का उपयोग करके समूह बनवाना।"

- act: probe_simpler_case
  teacher_line_hi: "अच्छा रवि, 52 में से 17 करने से पहले, मुझे 12 में से 7 घटाकर दिखाओ।"
  quote: "पहले, मुझे 12 में से 7 घटाकर दिखाओ"
  addressed_child: ravi
  context_hi: "इकाई के घटाव की सरल उप-समस्या देना"
  explanation_hi: "जटिल समस्या से पहले उसी नियम का सरल उदाहरण प्रस्तुत करना।"

- act: probe_simpler_case
  teacher_line_hi: "बड़ी संख्या से पहले छोटी संख्या लेते हैं—पहले 10 तीलियों में से 4 निकालो।"
  quote: "पहले 10 तीलियों में से 4 निकालो"
  addressed_child: null
  context_hi: "सरल संख्या से शुरुआत"
  explanation_hi: "अवधारणा की जाँच के लिए सरलतर केस का उपयोग।"

- act: contrast_answers
  teacher_line_hi: "रवि ने 45 कहा और प्रिया ने 35 कहा, दोनों उत्तर बोर्ड पर देखो—किसका उत्तर सही लगता है?"
