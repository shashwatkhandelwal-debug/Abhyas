# content/act_examples_hi.yaml
# Worked examples for teaching acts in Hindi primary FLN classrooms (spec/05 §5.4).
# Fixed taxonomy of 14 acts: >= 2 examples per act (28 total), including the Ravi worked example.

- act: ask_to_explain
  teacher_line_hi: "रवि, तुमने 52 में से 17 कैसे घटाया? मुझे एक-एक कदम समझाओ।"
  quote: "कैसे घटाया? मुझे एक-एक कदम समझाओ"
  addressed_child: ravi
  context_hi: "हासिल वाला घटाव (52 - 17) - रवि worked example टर्न 1"
  explanation_hi: "शिक्षिका बच्चे से उसकी सोच और गणना का तरीका पूछती है।"

- act: ask_to_explain
  teacher_line_hi: "प्रिया, तुमने 35 उत्तर कैसे सोचा, मुझे बताओ तो?"
