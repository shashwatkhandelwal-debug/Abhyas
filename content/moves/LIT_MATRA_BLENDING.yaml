    - {persona_id: priya, misconception: FIRST_AKSHAR_GUESS}   # मछली
    - {persona_id: aman,  misconception: MATRA_DROP}           # मल
  guess_lexicon:
    म: [मछली, मटर]
    प: [पतंग, पत्ता]
    क: [कमल, कलम]
    ग: [गमला, गाय]
    न: [नल, नाव]
    ब: [बतख, बस]
    र: [रथ, रस्सी]
    स: [सड़क, सेब]
    ल: [लट्टू, लड्डू]
    ट: [टमाटर, टोपी]
    च: [चमचा, चिड़िया]
    आ: [आम, आग]

