    must_have: true
    keywords_hi: [उँगली, ध्वनि, मात्रा, मे]
    source_chunk_ids: []
  - id: kp3
    text_hi: "फिर धीरे-धीरे अक्षरों को मिलाकर बुलवाएँ: मे… ला… मेला। पहले शिक्षक करके दिखाएँ, फिर बच्चे साथ में।"
