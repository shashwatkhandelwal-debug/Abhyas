  - {speaker: teacher, text_hi: "रवि, शाबाश कोशिश की। अब उँगली रखकर बोलो: म… ए… मे। फिर ल… आ… ला।", acts: [phonics_sound_out, praise_effort], addressed: ravi, problem: null}
