    label_hi: "इकाई का अंक पहले और दहाई का अंक बाद में लिखता है (47 की जगह 74)"
    label_en: "Writes the ones digit first and the tens digit after it"
    reveal_hi: "{child} खुली तीलियों की संख्या 7 पहले लिखता है और बंडलों की संख्या 4 बाद में। इसी से 74 आता है।"
    reveal_en: "{child} writes the number of loose sticks, 7, first and the number of bundles, 4, after it. That is how 74 comes about."
    keywords:
      - उल्टा
      - उलट
      - अंक उल्टे
      - अंक बदल
      - अंक आगे-पीछे
