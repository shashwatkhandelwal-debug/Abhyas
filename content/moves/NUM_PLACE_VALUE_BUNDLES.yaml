# ── One-on-one practice (the teacher talks to ONE child; diagnose first) ──────────────────────────
one_on_one_intro_hi: "मेज़ पर {tens} बंडल (हर बंडल में 10 तीलियाँ) और {ones} खुली तीलियाँ हैं। सवाल: कुल कितनी तीलियाँ? {child} ने उत्तर बताया: {answer}। उत्तर गलत है। पहले सोचिए: आपको क्या लगता है, {child} ने कहाँ गलती की? अपने शब्दों में बताइए।"
one_on_one_intro_en: "The table has {tens} bundles (10 sticks in each) and {ones} loose sticks. Question: how many sticks in all? {child} answered {answer}, which is wrong. First think: where do you think {child} went wrong? Say it in your own words."

