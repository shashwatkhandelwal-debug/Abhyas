  PV_BUNDLE_AS_ONE:
    label_hi: "हर बंडल को 1 गिनता है, 10 नहीं (4 बंडल + 7 = 11)"
    label_en: "Counts each bundle as 1, not 10 (4 bundles + 7 = 11)"
    reveal_hi: "{child} हर बंडल को 1 तीली गिनता है: 4 बंडल यानी 4 और 7 खुली तीलियाँ, कुल 11। इसी से 11 आता है।"
    reveal_en: "{child} counts each bundle as 1 stick: 4 bundles make 4, plus 7 loose, 11 in all. That is how 11 comes about."
