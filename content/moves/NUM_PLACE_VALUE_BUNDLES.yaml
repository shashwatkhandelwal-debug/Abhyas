      text_hi: "नए सवाल पर जाँचना"
      levels:
        0: "नया सवाल नहीं दिया"
        1: "नया सवाल दिया, पर देखा नहीं कि बच्चा नया तरीका लगा रहा है या नहीं"
        2: "नया सवाल देकर देखा कि बच्चा अब खुद सही तरीका लगाता है"
      signal_acts: [give_new_problem]
      negative_acts: []

feedback_bank_one_on_one:
  asks_to_explain:
    strength_hi: "आपने बच्चे से पूछा कि उसने संख्या कैसे बनाई, इससे उसकी असली उलझन सामने आई।"
    change_hi: "अगली बार 'गलत है' कहने से पहले बच्चे से पूछिए कि उसने संख्या कैसे लिखी।"
    exact_words_hi: "तुमने ये संख्या कैसे लिखी? पहले कौन-सा अंक लिखा और क्यों?"
    strength_en: "You asked how the child made the number, which brought the real confusion into the open."
    change_en: "Next time, before saying 'wrong', ask the child how they wrote the number."
    exact_words_en: "How did you write this number? Which digit did you write first, and why?"
  does_not_tell_answer:
    strength_hi: "आपने उत्तर खुद नहीं बताया, बच्चे को सोचने का मौका दिया।"
    change_hi: "उत्तर बताने के बजाय दो उत्तर सामने रखकर पूछिए कि कौन-सा सही है।"
    exact_words_hi: "तुमने पहले एक उत्तर कहा था, अब तीलियाँ गिनकर दूसरा आया। कौन-सा ठीक है, और क्यों?"
    strength_en: "You did not tell the answer and gave the child room to think."
    change_en: "Instead of telling the answer, put two answers side by side and ask which one is right."
    exact_words_en: "You said one answer before and counting the sticks gives another. Which is right, and why?"
  uses_concrete_representation:
    strength_hi: "आपने बंडल और तीलियाँ गिनवाईं, यह बच्चे को दिखता है।"
    change_hi: "अगली बार हर बंडल की 10 तीलियाँ बच्चे से गिनवाइए, फिर खुली तीलियाँ।"
    exact_words_hi: "हर बंडल में 10 तीलियाँ हैं। मेरे साथ गिनो: 10, 20, 30, 40। अब खुली तीलियाँ गिनो।"
    strength_en: "You had the child count bundles and sticks, which the child can see."
    change_en: "Next time, have the child count the 10 sticks in each bundle, then the loose sticks."
    exact_words_en: "Each bundle has 10 sticks. Count with me: 10, 20, 30, 40. Now count the loose sticks."
  probes_with_followup:
    strength_hi: "आपने बच्चे के जवाब के बाद एक और सवाल पूछा, इससे उसकी समझ परखी गई।"
    change_hi: "बच्चे के जवाब के बाद 'क्यों?' पूछिए या कोई आसान सवाल दीजिए।"
    exact_words_hi: "अच्छा, ये बताओ, तुमने यहाँ ऐसा क्यों किया? आसान सवाल 2 बंडल और 3 तीलियाँ पर भी देखें?"
    strength_en: "You asked one more question after the child's answer, which tested the understanding."
    change_en: "After the child answers, ask 'why?' or give an easier question."
    exact_words_en: "Tell me, why did you do it this way here? Shall we try an easier one, 2 bundles and 3 sticks?"
  checks_on_new_problem:
    strength_hi: "आपने नया सवाल देकर देखा कि बच्चा अब खुद तरीका लगा पाता है या नहीं।"
    change_hi: "समझ आने पर एक नया सवाल दीजिए और देखिए कि बच्चा खुद करता है।"
    exact_words_hi: "अब ये नया सवाल तुम खुद करो: 3 बंडल और 5 तीलियाँ। कैसे करोगे, बताओ।"
    strength_en: "You gave a new problem to see whether the child can now use the method alone."
    change_en: "Once the child gets it, give a new problem and watch them do it alone."
    exact_words_en: "Now try this new one yourself: 3 bundles and 5 sticks. Tell me how you will do it."
