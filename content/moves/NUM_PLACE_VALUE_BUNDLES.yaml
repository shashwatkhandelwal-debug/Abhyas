rubric_one_on_one:
  criteria:
    - id: asks_to_explain
      text_hi: "बच्चे से उसका तरीका पूछना"
      levels:
        0: "बच्चे का तरीका नहीं पूछा"
        1: "पूछा, पर केवल 'गलत है' कहकर आगे बढ़ गए"
        2: "पूछा कि उसने संख्या कैसे लिखी या गिनी और उसकी बात सुनी"
      signal_acts: [ask_to_explain]
      negative_acts: []
    - id: does_not_tell_answer
      text_hi: "सही उत्तर बताने के बजाय बच्चे को खुद सोचने देना"
      levels:
        0: "सही उत्तर खुद बता दिया"
        1: "उत्तर नहीं बताया, पर बच्चे से तुलना या जाँच नहीं करवाई"
        2: "उत्तर नहीं बताया; दो उत्तरों की तुलना या जाँच बच्चे से करवाई"
      signal_acts: [contrast_answers]
      negative_acts: [tell_answer]
    - id: uses_concrete_representation
      text_hi: "बंडल और तीलियों का उपयोग"
      levels:
        0: "केवल अंकों में समझाया"
