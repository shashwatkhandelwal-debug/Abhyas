  ADD_CARRY_WRONG_DIGIT:
    label_hi: "इकाई के जोड़ (13) में 3 की जगह 1 लिखता है और 3 को हासिल बनाकर दहाई में जोड़ देता है"
    label_en: "Writes the 1 of the units sum (13) and carries the 3 instead of writing the 3 and carrying the 1"
    reveal_hi: "{child} 8 + 5 = 13 में 1 इकाई में लिख देता है और 3 हासिल दहाई में जोड़ता है: 3 + 4 + 3 = 10। इसी से 101 आता है।"
    reveal_en: "{child} writes the 1 of 13 in the units place and carries the 3 to the tens: 3 + 4 + 3 = 10. That is how 101 comes about."
