misconceptions:
  ADD_CARRY_FORGOTTEN:
    label_hi: "इकाई का जोड़ 10 से ज़्यादा होने पर 1 हासिल (नया बंडल) दहाई में जोड़ना भूल जाता है"
    label_en: "When the units add to 10 or more, forgets to carry 1 (a new bundle) to the tens"
    reveal_hi: "{child} इकाई में 8 + 5 = 13 में से 3 लिख देता है, पर 1 हासिल दहाई में नहीं जोड़ता; 3 + 4 = 7 कर देता है। इसी से 73 आता है।"
    reveal_en: "{child} writes the 3 of 8 + 5 = 13 but does not add the carried 1 to the tens; does 3 + 4 = 7. That is how 73 comes about."
    keywords:
      - हासिल भूल
      - हासिल जोड़ना भूल
      - हासिल नहीं जोड़ा
