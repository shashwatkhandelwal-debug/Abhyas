      - forgot to carry
      - did not carry
      - didnt carry
      - carry bhool
      - carry nahi
      - hasil bhool
      - hasil nahi
  ADD_NO_CARRY:
    label_hi: "इकाई का पूरा जोड़ (13) एक साथ लिख देता है और दहाई का जोड़ उसके बाईं ओर रख देता है"
    label_en: "Writes the whole units sum (13) and places the tens sum to its left"
    reveal_hi: "{child} इकाई का पूरा जोड़ 13 लिखता है और दहाई का जोड़ 7 उसके आगे रख देता है। इसी से 713 आता है।"
    reveal_en: "{child} writes the whole units sum 13 and puts the tens sum 7 in front of it. That is how 713 comes about."
    keywords:
      - पूरा जोड़ लिख
