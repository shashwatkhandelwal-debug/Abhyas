one_on_one_intro_hi: "बोर्ड पर लिखा है: {a} + {b}। {child} ने उत्तर बताया: {answer}। उत्तर गलत है। पहले सोचिए: आपको क्या लगता है, {child} ने कहाँ गलती की? अपने शब्दों में बताइए।"
one_on_one_intro_en: "The board says {a} + {b}. {child} answered {answer}, which is wrong. First think: where do you think {child} went wrong? Say it in your own words."

