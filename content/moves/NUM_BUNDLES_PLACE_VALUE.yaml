id: NUM_BUNDLES_PLACE_VALUE
domain: numeracy
title_hi: बंडल और तीली से हासिल का घटाव
module_ref:
  module_name: UP FLN Ganit Sandarshika Class 2
  section: Adhyay 4 Sthaniya Maan
  page: 42
sankul_month: October
key_points:
  - id: kp1
    text_hi: दहाई की अवधारणा समझाने के लिए 10 तीलियों का एक बंडल बनवाना आवश्यक है।
    must_have: true
  - id: kp2
    text_hi: 52 में से 17 घटाते समय 2 तीली में से 7 नहीं घट सकती, इसलिए 1 बंडल खोलना पड़ता है।
    must_have: true
  - id: kp3
    text_hi: बंडल खोलने पर 10 खुली तीलियाँ मिलती हैं, जिससे कुल 12 तीलियाँ हो जाती हैं।
    must_have: true
  - id: kp4
    text_hi: बच्चे को सीधे उत्तर बताने के बजाय तीलियों को गिनने के लिए प्रेरित करना।
    must_have: true
teaching_acts_effective:
  - ask_to_explain
  - concrete_representation
  - contrast_answers
  - probe_simpler_case
target_causes:
  - SUB_SMALLER_FROM_LARGER
rubric:
  criteria:
    - id: crit_explaining
      text: बच्चे से सोचने का तरीका पूछना
      levels:
        0: सीधे सही उत्तर बता दिया
        1: केवल गलत कहा, तरीका नहीं पूछा
        2: बच्चे से पूछा कि उसने घटाव कैसे किया
    - id: crit_concrete
      text: तीली और बंडल का मूर्त उपयोग
      levels:
        0: केवल अंकों में समझाया
        1: तीली का नाम लिया पर बंडल खोलकर नहीं दिखाया
        2: 5 बंडल 2 तीली और बंडल खोलकर 12 तीली स्पष्ट दिखाई
learn_script_hi: >
  नमस्ते शिक्षक साथियों। आज हम बात करेंगे हासिल वाले घटाव की। जब बच्चे 52 में से 17 घटाते हैं, 
  तो अक्सर वे 2 में से 7 न घटने पर 7 में से 2 घटाकर 45 लिख देते हैं। 
  इसे ठीक करने के लिए हम 10-10 तीलियों के बंडल का उपयोग करते हैं...
model_rehearsal:
  - speaker: teacher
    text_hi: रवि, 52 में से 17 कैसे घटाया? मुझे अपना तरीका समझाओ।
    act: ask_to_explain
  - speaker: ravi
    text_hi: 2 में से 7 नहीं घटता, तो मैंने 7 में से 2 घटाया। 45 आया!
  - speaker: teacher
    text_hi: अच्छा! चलो तीलियों से देखते हैं। यह रहे 5 बंडल और 2 खुली तीली। क्या 2 में से 7 तीली दे सकते हो?
    act: concrete_representation
scenario:
  problem_text_hi: 52 - 17 का घटाव
  items:
    - question: 52 - 17
      expected_correct: 35
    - question: 43 - 27
      expected_correct: 16
  personas:
    - id: ravi
      name: रवि
      grade: 2
      voice_id: child_boy_1
      misconceptions:
        - SUB_SMALLER_FROM_LARGER
      temperament: confident
      speech_style_hi: सीधा और उत्साही
peer_checklist:
  - क्या शिक्षक ने तीली और बंडल का उपयोग किया?
  - क्या बच्चे ने खुद बंडल खोलकर देखा?
reflection_questions:
  - आज कक्षा में बंडल खोलते समय बच्चों को कहाँ सबसे ज्यादा उलझन हुई?
  - कितने बच्चों ने खुद 12 में से 7 तीली अलग कीं?
