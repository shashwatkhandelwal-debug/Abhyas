# English mirror of messages_hi.yaml — UI text and system messages for users who switch the
# UI to English (Hindi stays the default). Every key of messages_hi.yaml must exist here with the
# same {placeholders}; backend/tests/unit/test_messages_en.py enforces it. No gender variants
# (text_m) are needed in English. Words the teacher says to children and chunk titles written at
# ingest time stay Hindi on purpose (see KEEP_HINDI in that test).
welcome: {text: "Hello! I am Abhyas — your practice partner. Each week, in about 15 minutes, we will learn one classroom move and practise it by voice with three children."}
consent_service: {text: "Before we start: your voice is turned into text and the audio is deleted straight away. Your scores are visible only to you unless you yourself allow sharing with your ARP. You can erase everything at any time by writing 'delete my data'. Do you agree?"}
consent_details: {text: "What we keep: your name, class, experience, the text of what you say, your practice scores and, if you tell us, the struggles you pick in 'My class' (from a fixed list, at most 3) and the teaching skill you want to get better at (from a fixed list, at most 2). What we do not keep: recordings of your voice, any information about children. Trainers (DIET/SCERT) only see totals for groups of 10 or more teachers, never anyone's name; your ARP does not see your class struggles or this choice."}
consent_declined: {text: "No problem. Whenever you want to start, send 'hello'."}
ask_join_code: {text: "Send the code your ARP gave you. If you do not have a code, write 'no'."}
join_code_invalid: {text: "That code was not found. Please send it again, or write 'no'."}
ask_name: {text: "What is your name?"}
ask_address_form: {text: "How should I address you?"}
btn_female: {text: "Teacher (she)"}
btn_male: {text: "Teacher (he)"}
ask_experience: {text: "{name}, how many years have you been teaching?"}
ask_classes: {text: "Which class do you teach this year?"}
consent_share_scores: {text: "Would you like your ARP to see your practice scores, so they can support you during classroom visits? You can change this at any time."}
placement_intro: {text: "Let's do a short practice. This is not a test. The board says: 52 − 17. Ravi from Class 2 says: '45!' Talk to Ravi the way you would in class — by voice or by typing."}
placement_done: {text: "Very good! Now I know where to start for you."}
ready_first_move: {text: "Your first move is: {move_title}. Let's begin!"}
learn_intro: {text: "This week's move: {move_title}. First listen to this 2-minute voice note. The key points are written below:"}
explain_back_prompt: {text: "Now, in 1 minute, tell me in your own words: what is the most important thing in this move? Send it by voice or by typing."}
explain_back_reply: {text: "Thank you! You mentioned {covered} of {total} key points."}
explain_back_missing: {text: "One more thing to remember: {point}"}
explain_back_misconception: {text: "Please note: {note}"}
fidelity_reply_summary: {text: "Thank you! You mentioned {n_covered} of {n_total} key points."}
fidelity_reply_missing: {text: "One more thing to remember: {text}"}
fidelity_reply_misconception: {text: "Please note: {text}"}
model_offer: {text: "Would you like to hear how another teacher does this move with these same three children? (about 1 minute)"}
model_header: {text: "Model practice:"}
rehearse_intro: {text: "{scene_intro} When you are ready, start talking to the children. Address a child by name. Say 'stop' to finish."}
child_silent: {text: "({name} is quiet and looking down.)"}
thinking: {text: "The children are thinking…"}
scene_turn_limit: {text: "The practice time is over."}
scene_all_correct: {text: "Wow! All three children understood."}
scene_ended_neutral: {text: "Let's look at the feedback now."}
feedback_header: {text: "Suggestions on your practice:"}
feedback_body: {text: "👍 {strength}\n🔁 {change}\n🗣️ Next time, try saying: \"{exact_words}\""}
feedback_trajectory: {text: "Change in the children: {trajectory}"}
coach_low_conf_prefix: {text: "(An expert will also look at this suggestion.)"}
realism_prompt: {text: "Did these children feel like real classroom children? Choose from 1 (not at all) to 5 (exactly like them)."}
rate_training_prompt: {text: "How useful was this week's practice for your work? Tell us any number from 1 (not at all) to 5 (very useful), typed or spoken."}
rate_training_comment_prompt: {text: "Thank you! If you like, tell us in one line what worked or what to change, typed or spoken. Tap 'Skip' if you would rather not."}
rate_training_unclear: {text: "Please give a number from 1 to 5 (5 = very useful)."}
btn_trate_1: {text: "1 (not at all)"}
btn_trate_3: {text: "3 (so-so)"}
btn_trate_5: {text: "5 (very useful)"}
rate_training_thanks: {text: "Thank you for your feedback."}
rate_training_skip_words: {text: "skip, no, none, nothing, n/a, na"}
rate_training_language_words: {text: "language, change language, english, hindi, lang"}
retry_limit: {text: "You have completed this week's 3 practices. Now it's time to try it in class!"}
try_in_class: {text: "Now try this move in your class. Ask a fellow teacher to watch for 5 minutes and fill in this list:"}
try_in_class_reflect: {text: "Or answer these 2 questions yourself:"}
peer_item: {text: "Peer checklist ({i}/{n}): {item}"}
reflect_q: {text: "Question {i}: {question}"}
week_done: {text: "Well done, {name}! This week you reached '{level_name}'. Next move: {next_move_title}."}
evidence_level_1: {text: "Practised"}
evidence_level_2: {text: "Explained it myself"}
evidence_level_3: {text: "Peer observed"}
evidence_level_4: {text: "ARP observed"}
evidence_level_5: {text: "Children improved"}
resume_prompt: {text: "You were at '{state_name}'. Shall we continue?"}
weekly_move: {text: "Hello {name}! This week's new move is ready: {move_title}. Shall we start?"}
reminder: {text: "{name}, your practice for this week is still pending. Can you spare 10 minutes?"}
ask_prompt: {text: "Send your question by voice or by typing."}
ask_clarify_prefix: {text: "Please tell me one thing:"}
ask_clarify_generic: {text: "Please ask your question in a little more detail."}
ask_source_line: {text: "Source: {source}{page_part}"}
ask_source_citation: {text: "Source: {source}, page {page}"}
ask_source_page_abbrev: {text: "p."}
ask_try_this_week: {text: "Try this week: {tip}"}
ask_escalated: {text: "Good question. I will ask your ARP and get you a reliable answer."}
learn_reference: {text: "What the official document says on this topic (summary): {summary}\n{citation}"}
ask_not_in_sources: {text: "I could not find the answer to this question in my official documents, so I won't guess. I will ask your ARP and get back to you."}
ask_out_of_scope: {text: "Sorry, I can only help with Class 1–3 teaching and classroom questions."}
ask_admin: {text: "This information will come from your BEO or ARP office. I have passed your question on to your ARP."}
ask_resume: {text: "Let's carry on from where we were."}
followup_question: {text: "{name}, you had asked about '{topic}'. Did the suggestion help?"}
followup_try_in_class: {text: "{name}, did you try '{move_title}' in class? Choose an option to share your experience:"}
arp_answer_delivered: {text: "Your ARP has sent the answer to your question: {answer}"}
