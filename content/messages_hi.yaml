consent_share_scores:
  text: "क्या आप अपने अभ्यास के अंक अपने ARP से साझा करना चाहती हैं? साझा करने पर आपके ARP अभ्यास का तरीका और आपके अंक देख सकेंगे, ताकि वे अगले भ्रमण से पहले इसी पर आपकी मदद की तैयारी कर सकें। केवल वह सवाल जिसका उत्तर हैंडबुक नहीं दे पाती ARP को भेजा जाता है, चैट से इसके अलावा कुछ भी नहीं। आपके ARP आपकी आवाज़ की रिकॉर्डिंग कभी नहीं देख सकते। इसे आप 'मेरी कक्षा' से कभी भी बदल सकती हैं।"
  text_m: "क्या आप अपने अभ्यास के अंक अपने ARP से साझा करना चाहते हैं? साझा करने पर आपके ARP अभ्यास का तरीका और आपके अंक देख सकेंगे, ताकि वे अगले भ्रमण से पहले इसी पर आपकी मदद की तैयारी कर सकें। केवल वह सवाल जिसका उत्तर हैंडबुक नहीं दे पाती ARP को भेजा जाता है, चैट से इसके अलावा कुछ भी नहीं। आपके ARP आपकी आवाज़ की रिकॉर्डिंग कभी नहीं देख सकते। इसे आप 'मेरी कक्षा' से कभी भी बदल सकते हैं।"
  audio: false
placement_intro:
  text: "चलिए, एक छोटा-सा अभ्यास करते हैं। यह कोई परीक्षा नहीं है। बोर्ड पर लिखा है: 52 − 17। कक्षा 2 का रवि कहता है: '45!' आप रवि से वैसे ही बात कीजिए जैसे कक्षा में करती हैं — बोलकर या लिखकर।"
  text_m: "चलिए, एक छोटा-सा अभ्यास करते हैं। यह कोई परीक्षा नहीं है। बोर्ड पर लिखा है: 52 − 17। कक्षा 2 का रवि कहता है: '45!' आप रवि से वैसे ही बात कीजिए जैसे कक्षा में करते हैं — बोलकर या लिखकर।"
