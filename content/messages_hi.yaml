# Teacher-facing message catalog. Keys referenced in spec/08. Placeholders in {braces}.
# audio: true → also sent as voice (narrator voice "abhyas") unless lite_mode. Keep sentences short and respectful (आप).
# Button titles must be ≤ 20 characters (WhatsApp limit).
# GENDER: texts below use feminine verb forms (most FLN teachers addressed are women). Teachers choose
# शिक्षिका/शिक्षक at onboarding (teacher.address_form = f|m). For every key whose text has gendered verbs
# (रही हैं, चाहती, थीं, पहुँचीं, बताऊँगी, गई, पाई, सकती …), the agent adds a `text_m` variant
# (रहे हैं, चाहते, थे, पहुँचे, बताऊँगा, गया …). messages.py picks text_m when address_form == "m".
# A test asserts every key containing a feminine marker has text_m.

# ── Onboarding ───────────────────────────────────────────────
welcome:
  text: "नमस्ते! मैं अभ्यास हूँ — आपकी अभ्यास-साथी। हर हफ्ते लगभग 15 मिनट में हम कक्षा का एक तरीका सीखेंगे, और तीन बच्चों के साथ बोलकर उसका अभ्यास करेंगे।"
  audio: true
consent_service:
  text: "शुरू करने से पहले: आपकी आवाज़ को लिखित रूप में बदलकर आवाज़ तुरंत मिटा दी जाती है। आपके अंक केवल आपको दिखेंगे, जब तक आप स्वयं ARP के साथ साझा करने की अनुमति न दें। 'मेरा डेटा हटाएँ' लिखकर कभी भी सब कुछ मिटाया जा सकता है। क्या आप सहमत हैं?"
  audio: true
consent_details:
  text: "हम क्या रखते हैं: आपका नाम, कक्षा, अनुभव, आपकी बातों का लिखित रूप और अभ्यास के अंक, और अगर आप बताएँ तो 'मेरी कक्षा' में आपकी चुनी हुई दिक्कतें (सूची से, अधिकतम 3) और पढ़ाने का कौशल (सूची से, अधिकतम 2)। हम क्या नहीं रखते: आपकी आवाज़ की रिकॉर्डिंग (तुरंत मिटा दी जाती है), बच्चों की कोई जानकारी। यदि आप ARP से साझा करने का विकल्प चुनती हैं, तो वे अभ्यास का तरीका और अंक देख सकेंगे ताकि वे भ्रमण से पहले मदद की तैयारी कर सकें। केवल वह सवाल जिसका उत्तर हैंडबुक नहीं दे पाती ARP को भेजा जाता है, चैट से इसके अलावा कुछ भी नहीं। ARP आपकी रिकॉर्डिंग कभी नहीं देख सकते। ट्रेनर (DIET/SCERT) को केवल 10 या उससे ज़्यादा शिक्षकों के कुल आँकड़े दिखते हैं, किसी का नाम नहीं।"
  text_m: "हम क्या रखते हैं: आपका नाम, कक्षा, अनुभव, आपकी बातों का लिखित रूप और अभ्यास के अंक, और अगर आप बताएँ तो 'मेरी कक्षा' में आपकी चुनी हुई दिक्कतें (सूची से, अधिकतम 3) और पढ़ाने का कौशल (सूची से, अधिकतम 2)। हम क्या नहीं रखते: आपकी आवाज़ की रिकॉर्डिंग (तुरंत मिटा दी जाती है), बच्चों की कोई जानकारी। यदि आप ARP से साझा करने का विकल्प चुनते हैं, तो वे अभ्यास का तरीका और अंक देख सकेंगे ताकि वे भ्रमण से पहले मदद की तैयारी कर सकें। केवल वह सवाल जिसका उत्तर हैंडबुक नहीं दे पाती ARP को भेजा जाता है, चैट से इसके अलावा कुछ भी नहीं। ARP आपकी रिकॉर्डिंग कभी नहीं देख सकते। ट्रेनर (DIET/SCERT) को केवल 10 या उससे ज़्यादा शिक्षकों के कुल आँकड़े दिखते हैं, किसी का नाम नहीं।"
  audio: false
consent_declined:
  text: "कोई बात नहीं। जब भी आप शुरू करना चाहें, 'नमस्ते' लिखकर भेजें।"
  audio: false
