[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abhyas"
version = "0.1.0"
description = "A voice-first WhatsApp practice partner for government primary FLN teachers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Team Asymptotes"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "apscheduler>=3.10.4",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.6.1",
    "regex>=2023.12.25",
    "passlib[bcrypt]>=1.7.4",
    "itsdangerous>=2.1.2",
    "cryptography>=42.0.5",
    "python-multipart>=0.0.9",
    "pypdf>=4.1.0",
    "httpx>=0.27.0",
    "anthropic>=0.20.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
ocr = [
    "pdfplumber>=0.10.4",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.3",
    "mypy>=1.9.0",
    "respx>=0.21.1",
    "hypothesis>=6.98.15",
    "freezegun>=1.4.0",
    "playwright>=1.42.0",
    "scikit-learn>=1.4.1",
    "types-pyyaml>=6.0.12",
    "types-passlib>=1.7.7.20240106",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "spec",
    "docs",
    "*.md",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "."
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
testpaths = [
    "backend/tests",
    "content/tests",
]
pythonpath = [
    ".",
    "eval",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools]
packages = ["backend", "content", "eval"]
