misconceptions:
  SUB_SMALLER_FROM_LARGER:
    label_hi: "इकाई में ऊपर का अंक छोटा होने पर बड़े अंक में से छोटा घटा देता है (7 − 3)"
    label_en: "When the top digit is smaller, subtracts the smaller digit from the larger (7 − 3)"
    reveal_hi: "{child} इकाई में 3 में से 7 नहीं घटा पाता, इसलिए उल्टा करके 7 − 3 = 4 कर देता है। दहाई में 4 − 2 = 2। इसी से 24 आता है।"
    reveal_en: "{child} cannot take 7 from 3, so flips it and does 7 − 3 = 4. Tens: 4 − 2 = 2. That is how 24 comes about."
    keywords:
      - उल्टा
      - बड़ी संख्या में से छोटी
      - बड़े में से छोटा
      - बड़े अंक में से छोटा
      - छोटी में से बड़ी
      - छोटे में से बड़ा
      - छोटा अंक बड़े
      - बड़ा अंक छोटे
      - ऊपर वाला अंक छोटा
      - ऊपर की संख्या छोटी
      - 7 में से 3
      - 7-3
      - 7 - 3
      - 7 minus 3
      - ulta
      - bade mein se chhota
      - chhote mein se bada
      - badi sankhya mein se chhoti
      - smaller from larger
      - flipped
      - reversed
  SUB_BORROW_NO_DECREMENT:
    label_hi: "हासिल (बंडल खोलना) लेता है, पर दहाई में से 1 कम करना भूल जाता है"
    label_en: "Borrows (opens a bundle) but forgets to reduce the tens by 1"
    reveal_hi: "{child} इकाई में 13 − 7 = 6 सही करता है, पर बंडल खोलने के बाद दहाई में 4 को 3 नहीं करता; 4 − 2 = 2 कर देता है। इसी से 26 आता है।"
    reveal_en: "{child} correctly does 13 − 7 = 6 but does not reduce the tens from 4 to 3 after opening a bundle; does 4 − 2 = 2. That is how 26 comes about."
    keywords:
      - दहाई में से 1 कम
      - दहाई में से एक कम
      - दहाई कम नहीं
      - दहाई घटाना भूल
      - दहाई वही
      - दहाई नहीं घटाई
      - दहाई नहीं घटाया
      - एक नहीं घटाया
      - 1 नहीं घटाया
      - 1 कम नहीं
      - एक कम नहीं
      - बंडल खोला पर
      - बंडल खोलकर भी
      - उधार लिया पर
      - उधार लेकर
      - हासिल लिया पर
      - हासिल लेकर भी
      - उधार के बाद
      - हासिल के बाद
      - 4 को 3 नहीं
      - 4 को 3 करना भूल
      - borrow kiya par
      - borrow kiya lekin
      - tens kam nahi
      - forgot to reduce
      - did not reduce
      - forgot to subtract the borrowed
  SUB_WRITE_ZERO_WHEN_STUCK:
    label_hi: "जब इकाई में घटाना नहीं हो पाता तो वहाँ 0 लिख देता है"
    label_en: "When the units cannot be subtracted, writes 0 there"
    reveal_hi: "{child} को 3 में से 7 नहीं घटता, तो वह इकाई में 0 लिख देता है और दहाई में 4 − 2 = 2 करता है। इसी से 20 आता है।"
    reveal_en: "{child} cannot take 7 from 3, so writes 0 in the units place and does 4 − 2 = 2 in the tens. That is how 20 comes about."
    keywords:
      - शून्य लिख
      - जीरो लिख
