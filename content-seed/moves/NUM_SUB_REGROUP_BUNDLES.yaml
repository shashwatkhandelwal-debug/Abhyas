feedback_bank_one_on_one:
  asks_to_explain:
    strength_hi: "आपने बच्चे से उसका तरीका पूछा, इससे उसकी असली उलझन सामने आई।"
    change_hi: "अगली बार 'गलत है' कहने से पहले बच्चे से पूछिए कि उसने कैसे घटाया।"
    exact_words_hi: "तुमने 43 में से 27 कैसे घटाया? मुझे एक-एक कदम बताओ।"
    strength_en: "You asked the child for their method, which brought the real confusion into the open."
    change_en: "Next time, before saying 'wrong', ask the child how they subtracted."
    exact_words_en: "How did you subtract 27 from 43? Tell me each step."
  does_not_tell_answer:
    strength_hi: "आपने उत्तर खुद नहीं बताया, बच्चे को सोचने का मौका दिया।"
    change_hi: "उत्तर बताने के बजाय दो उत्तर सामने रखकर पूछिए कि कौन-सा सही है।"
    exact_words_hi: "तुमने पहले एक उत्तर कहा था, अब तीलियाँ गिनकर दूसरा आया। कौन-सा ठीक है, और क्यों?"
    strength_en: "You did not tell the answer and gave the child room to think."
    change_en: "Instead of telling the answer, put two answers side by side and ask which one is right."
    exact_words_en: "You said one answer before and counting the sticks gives another. Which is right, and why?"
  uses_concrete_representation:
    strength_hi: "आपने बंडल और तीलियों से संख्या बनवाई, यह बच्चे को दिखता है।"
    change_hi: "अगली बार बंडल खोलकर बच्चे से खुली तीलियाँ गिनवाइए।"
    exact_words_hi: "3 तीलियों में से 7 नहीं निकलतीं, तो एक बंडल खोलो। अब गिनो, कितनी खुली तीलियाँ हुईं?"
    strength_en: "You built the number with bundles and sticks, which the child can see."
    change_en: "Next time, open a bundle and have the child count the loose sticks."
    exact_words_en: "You cannot take 7 sticks from 3, so open one bundle. Now count: how many loose sticks are there?"
  probes_with_followup:
    strength_hi: "आपने बच्चे के जवाब के बाद एक और सवाल पूछा, इससे उसकी समझ परखी गई।"
    change_hi: "बच्चे के जवाब के बाद 'क्यों?' पूछिए या कोई आसान सवाल दीजिए।"
    exact_words_hi: "अच्छा, ये बताओ, तुमने यहाँ ऐसा क्यों किया? आसान सवाल 23 में से 8 पर भी देखें?"
    strength_en: "You asked one more question after the child's answer, which tested the understanding."
    change_en: "After the child answers, ask 'why?' or give an easier question."
    exact_words_en: "Tell me, why did you do it this way here? Shall we try an easier one, 8 from 23?"
  checks_on_new_problem:
    strength_hi: "आपने नया सवाल देकर देखा कि बच्चा अब खुद तरीका लगा पाता है या नहीं।"
    change_hi: "समझ आने पर एक नया सवाल दीजिए और देखिए कि बच्चा खुद करता है।"
    exact_words_hi: "अब ये नया सवाल तुम खुद करो: 52 में से 17। कैसे करोगे, बताओ।"
    strength_en: "You gave a new problem to see whether the child can now use the method alone."
    change_en: "Once the child gets it, give a new problem and watch them do it alone."
    exact_words_en: "Now try this new one yourself: 17 from 52. Tell me how you will do it."
