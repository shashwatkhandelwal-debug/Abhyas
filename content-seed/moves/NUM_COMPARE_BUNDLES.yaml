title_hi: "दो अंकों की संख्याओं की तुलना: पहले बंडल गिनकर"
summary_hi: "जब बच्चा इकाई देखकर बड़ी संख्या बताए, तो उससे उसका तरीका पूछें और बंडल-तीली से दोनों संख्याएँ बनवाकर तुलना करवाएँ।"
tags: [comparison, place_value, bundles, ganit]
