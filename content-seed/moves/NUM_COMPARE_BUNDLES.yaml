  source_id: up_ganit_sandarshika_c1
  section: "संख्याओं की तुलना"
  page: null
  verified: false
sankul_month: October

key_points:
  - id: kp1
    text_hi: "कई बच्चे 39 और 41 में पहले इकाई देखते हैं: 9 बड़ा है, तो 39 बड़ा। सबसे पहले बच्चे से पूछें कि उसने कैसे तय किया।"
    text_en: "Many children look at the ones first for 39 and 41: 9 is bigger, so 39 is bigger. First ask the child how they decided."
    must_have: true
    keywords_hi: [पूछें, कैसे, तरीका, इकाई, पहले]
    source_chunk_ids: []
  - id: kp2
    text_hi: "संख्याओं की तुलना कंकड़, ब्लॉक्स या तीलियों जैसी ठोस चीज़ों से करवाएँ और पूछें कि किसमें कम हैं और किसमें ज़्यादा।"
    text_en: "Compare numbers with real things such as pebbles, blocks or sticks, and ask which has fewer and which has more."
    must_have: true
    keywords_hi: [कंकड़, तीली, ठोस, कम, ज़्यादा]
    source_chunk_ids: ["up_ganit_sandarshika_c1:p041:060"]
  - id: kp3
    text_hi: "दोनों संख्याएँ बंडल और खुली तीलियों से बनवाएँ: 39 यानी 3 बंडल और 9 तीलियाँ, 41 यानी 4 बंडल और 1 तीली। पहले बंडल गिनें, जिसके बंडल ज़्यादा हों वही संख्या बड़ी है।"
    text_en: "Build both numbers with bundles and loose sticks: 39 is 3 bundles and 9 sticks, 41 is 4 bundles and 1 stick. Count the bundles first; the number with more bundles is bigger."
    must_have: true
    keywords_hi: [बंडल, तीली, पहले, ज़्यादा, बड़ी]
    source_chunk_ids: ["up_ganit_sandarshika_c1:p109:166"]
  - id: kp4
    text_hi: "बच्चों से 'ज़्यादा', 'कम', 'बराबर', 'बड़ा' और 'छोटा' जैसे शब्द खुद बुलवाएँ। बंडल बराबर हों, तभी खुली तीलियाँ देखें।"
    text_en: "Have children say the words more, fewer, equal, bigger and smaller themselves. Look at the loose sticks only when the bundles are equal."
    must_have: false
    keywords_hi: [ज़्यादा, कम, बराबर, बड़ा, छोटा]
    source_chunk_ids: ["up_ganit_sandarshika_c1:p030:039"]
  - id: kp5
    text_hi: "सही उत्तर खुद न बताएँ। बच्चे से बंडल गिनवाएँ और उसे खुद देखने दें कि कौन-सी संख्या बड़ी है।"
    text_en: "Do not tell the answer yourself. Have the child count the bundles and see for themselves which number is bigger."
    must_have: true
    keywords_hi: [न बताएँ, गिनवाएँ, खुद, देखने]
    source_chunk_ids: []

