misconceptions:
  CMP_ONES_FIRST:
    label_hi: "पहले इकाई देखकर तय करता है कि कौन-सी संख्या बड़ी है (दहाई नहीं देखता)"
    label_en: "Looks at the ones first to decide which number is bigger (does not look at the tens)"
    reveal_hi: "{child} पहले इकाई देखता है: 9 और 1 में 9 बड़ा है, तो वह 39 को बड़ा कह देता है। दहाई, यानी बंडल, पर उसका ध्यान नहीं जाता: 3 बंडल और 4 बंडल।"
    reveal_en: "{child} looks at the ones first: 9 is more than 1, so 39 is called bigger. The tens, the bundles, are not looked at: 3 bundles against 4 bundles."
    keywords:
      - इकाई पहले
      - इकाई देखी
      - इकाई देखकर
      - इकाई देख
      - इकाई वाला अंक
      - पहले इकाई
      - अंत का अंक
      - आखिरी अंक
      - आख़िरी अंक
      - दाएँ वाला अंक
      - दहाई नहीं देखी
      - दहाई नहीं देखा
      - दहाई नहीं देख
      - दहाई को नहीं
      - बंडल नहीं देखे
      - 9 बड़ा
      - 9 और 1
      - looked at ones
      - looks at the ones
      - ones first
      - last digit
      - did not look at tens
      - ignored the tens
      - ikai pehle
      - ikai dekhi

