feedback_bank_one_on_one:
  asks_to_explain:
    strength_hi: "आपने बच्चे से उसका तरीका पूछा, इससे उसकी असली उलझन सामने आई।"
    change_hi: "अगली बार 'गलत है' कहने से पहले बच्चे से पूछिए कि उसने कैसे तय किया।"
    exact_words_hi: "तुमने कैसे तय किया कि 39 बड़ा है? मुझे एक-एक कदम बताओ।"
    strength_en: "You asked the child for their method, which brought the real confusion into the open."
    change_en: "Next time, before saying 'wrong', ask the child how they decided."
    exact_words_en: "How did you decide that 39 is bigger? Tell me each step."
  does_not_tell_answer:
    strength_hi: "आपने उत्तर खुद नहीं बताया, बच्चे को सोचने का मौका दिया।"
    change_hi: "उत्तर बताने के बजाय दो उत्तर सामने रखकर पूछिए कि कौन-सा सही है।"
    exact_words_hi: "तुमने पहले एक उत्तर कहा था, अब बंडल गिनकर दूसरा आया। कौन-सा ठीक है, और क्यों?"
    strength_en: "You did not tell the answer and gave the child room to think."
    change_en: "Instead of telling the answer, put two answers side by side and ask which one is right."
    exact_words_en: "You said one answer before and counting the bundles gives another. Which is right, and why?"
  uses_concrete_representation:
    strength_hi: "आपने दोनों संख्याएँ बंडल और तीलियों से बनवाईं, यह बच्चे को दिखता है।"
    change_hi: "अगली बार दोनों संख्याओं के बंडल रखवाइए और बच्चे से पहले बंडल गिनवाइए।"
    exact_words_hi: "39 के 3 बंडल और 41 के 4 बंडल रखो। अब गिनो, किसके बंडल ज़्यादा हैं?"
    strength_en: "You had both numbers built with bundles and sticks, which the child can see."
    change_en: "Next time, put out the bundles for both numbers and have the child count the bundles first."
    exact_words_en: "Put out 3 bundles for 39 and 4 bundles for 41. Now count: which has more bundles?"
  probes_with_followup:
    strength_hi: "आपने बच्चे के जवाब के बाद एक और सवाल पूछा, इससे उसकी समझ परखी गई।"
    change_hi: "बच्चे के जवाब के बाद 'क्यों?' पूछिए या कोई आसान सवाल दीजिए।"
    exact_words_hi: "अच्छा, ये बताओ, तुमने यहाँ ऐसा क्यों किया? आसान सवाल 12 और 21 पर भी देखें?"
    strength_en: "You asked one more question after the child's answer, which tested the understanding."
    change_en: "After the child answers, ask 'why?' or give an easier question."
    exact_words_en: "Tell me, why did you do it this way here? Shall we try an easier one, 12 and 21?"
  checks_on_new_problem:
    strength_hi: "आपने नया सवाल देकर देखा कि बच्चा अब खुद तरीका लगा पाता है या नहीं।"
    change_hi: "समझ आने पर एक नया सवाल दीजिए और देखिए कि बच्चा खुद करता है।"
    exact_words_hi: "अब ये नया सवाल तुम खुद करो: 28 और 33, कौन बड़ा? कैसे तय करोगे, बताओ।"
    strength_en: "You gave a new problem to see whether the child can now use the method alone."
    change_en: "Once the child gets it, give a new problem and watch them do it alone."
    exact_words_en: "Now try this new one yourself: 28 and 33, which is bigger? Tell me how you will decide."
