learn_script_hi: >-
  नमस्ते! इस हफ्ते हम दो अंकों की संख्याओं की तुलना का एक तरीका सीखेंगे। जब बच्चों से पूछा जाता है कि 39 और 41
  में कौन बड़ा है, तो कई बच्चे इकाई देखते हैं। वे कहते हैं, 9 बड़ा है, इसलिए 39 बड़ा। यह लापरवाही नहीं है, बच्चे के मन
  में एक नियम बैठा होता है। इसलिए पहला कदम है: बच्चे से पूछिए, तुमने कैसे तय किया? जब बच्चा अपना तरीका बताता है, तब
  पता चलता है कि उलझन कहाँ है। दूसरा कदम: 10-10 तीलियों के बंडल लीजिए। दोनों संख्याएँ बनवाइए। 39 के 3 बंडल और 9
  खुली तीलियाँ, 41 के 4 बंडल और 1 तीली। अब पूछिए, किसके बंडल ज़्यादा हैं? बच्चा खुद देखेगा कि 4 बंडल ज़्यादा हैं, तो 41 बड़ा
  है। जब बंडल बराबर हों, तभी खुली तीलियाँ देखनी हैं। तीसरा कदम: उत्तर खुद मत बताइए। दो उत्तर सामने रखिए, 39 और 41, और
  पूछिए कि कौन-सा बड़ा है और क्यों। बच्चों से ज़्यादा, कम, बराबर, बड़ा और छोटा जैसे शब्द खुद बुलवाइए। और ध्यान रखिए, कक्षा का
  शांत बच्चा भी बोले। अब आप यह तरीका अपने शब्दों में बताइए, फिर तीन बच्चों के साथ अभ्यास करेंगे।
learn_summary_hi:
  - "1. पहले बच्चे से पूछें: तुमने कैसे तय किया?"
  - "2. दोनों संख्याएँ बंडल-तीली से बनवाएँ: 39 = 3 बंडल + 9 तीलियाँ, 41 = 4 बंडल + 1 तीली"
  - "3. पहले बंडल गिनें; बंडल बराबर हों तभी तीलियाँ देखें"
  - "4. उत्तर न बताएँ, दो उत्तरों की तुलना करवाएँ"
  - "5. शांत बच्चे को भी मौका दें"

