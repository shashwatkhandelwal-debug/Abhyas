# Labelled sentences for "My class": what a teacher might say -> the ids the closed library should return.
#
# Written and labelled by the build team (not by teachers), so this measures the matcher and the
# classifier against our own reading of the library, not against real classroom speech. Replace or add
# lines from real teachers (with consent) when user testing produces them.
#
# expect: ordered ids (the first is the one she stresses first). [] = nothing on the list fits and
# the right behaviour is to store nothing ("something else").
#   kind: hi = Hindi, hinglish = Latin script Hindi, en = English, two = two struggles in one sentence,
#         none = out of scope for the closed list

- {id: s01, kind: hi, text: "बच्चे गिनती में बार-बार गलती करते हैं, कोई संख्या छोड़ देते हैं", expect: [NUM_COUNTING]}
