name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: GET /healthz
        run: curl --fail --silent --show-error --max-time 60 --retry 2 --retry-delay 10 https://abhyas-vjh5.onrender.com/healthz
